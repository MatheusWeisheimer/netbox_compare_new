[project]
name = "netbox-compare-access"
version = "0.1.0"
description = "Compare documented (NetBox) and observed (device) network state."
requires-python = ">=3.11"
dependencies = [
    "napalm>=5",
    "napalm-huawei-vrp>=1.2",
    # paramiko 5 dropped the SHA-1 key exchanges (diffie-hellman-group14-sha1,
    # group-exchange-sha1) that older Huawei VRP routers offer exclusively.
    "paramiko>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_compare_access"]
