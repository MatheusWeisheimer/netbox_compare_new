<div class="form-check">
  <input type="checkbox" name="{{ widget.name }}" value="{{ widget.value|stringformat:'s' }}" id="{{ widget.attrs.id }}" class="form-check-input"{% if widget.attrs.checked %} checked{% endif %}>
  <label class="form-check-label" for="{{ widget.attrs.id }}">{{ widget.label }}</label>
</div>
